<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layal</title>
<link rel="preload" href="../fonts/JetBrainsMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
<style>
    @font-face {
        font-family: "JetBrains Mono";
        src: url("../fonts/JetBrainsMono-Regular.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
    }

    :root {
        --amber: #ffb347;
        --amber-dim: #a86c1e;
        --wood-1: #5a3a22;
        --wood-2: #3e2716;
        --screen-black: #0a0503;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at center, #241a14 0%, #100b08 100%);
        font-family: "JetBrains Mono", monospace;
        padding: 2rem;
    }

    .tv {
        width: min(92vw, 720px);
        aspect-ratio: 480 / 270;
        position: relative;
        background: url("tv.png") center / 100% 100% no-repeat;
        filter: drop-shadow(0 20px 40px rgba(0,0,0,0.6));
    }

    /* Positioned over the green-screen area of tv.png (480x270 source). */
    .screen {
        position: absolute;
        left: 10%;
        top: 4.5%;
        width: 66%;
        height: 90%;
        border-radius: 14% / 11%;
        background: var(--screen-black);
        overflow: hidden;
        color: var(--amber);
    }

    .screen::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        background: repeating-linear-gradient(
            to bottom,
            rgba(0,0,0,0) 0px, rgba(0,0,0,0) 1px,
            rgba(0,0,0,0.25) 2px, rgba(0,0,0,0.25) 3px
        );
        mix-blend-mode: multiply;
    }

    .screen::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 6;
        pointer-events: none;
        background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
    }

    .flicker {
        position: absolute;
        inset: 0;
        z-index: 10;
        background: repeating-linear-gradient(0deg, #fff 0 2px, #888 2px 4px, #222 4px 6px);
        opacity: 0;
        pointer-events: none;
    }
    .flicker.on {
        animation: static-flicker 0.5s steps(6, end);
    }
    @keyframes static-flicker {
        0%   { opacity: 0.95; }
        16%  { opacity: 0.2; }
        33%  { opacity: 0.9; }
        50%  { opacity: 0.1; }
        66%  { opacity: 0.85; }
        83%  { opacity: 0.15; }
        100% { opacity: 0; }
    }

    .view {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 1.4rem;
        text-align: center;
    }
    .view.active { display: flex; }

    .glow-text {
        text-shadow: 0 0 8px rgba(255, 179, 71, 0.7);
        font-size: 1.05rem;
        cursor: pointer;
    }
    .glow-text.small { font-size: 0.85rem; opacity: 0.8; }

    .pin-display {
        font-size: 1.8rem;
        letter-spacing: 0.5rem;
        text-shadow: 0 0 8px rgba(255, 179, 71, 0.8);
    }
    .pin-display.error { animation: shake 0.4s; color: #ff5f56; }
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-8px); }
        75% { transform: translateX(8px); }
    }

    .keypad {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.6rem;
    }
    .keypad button {
        font-family: inherit;
        font-size: 1rem;
        width: 2.6rem;
        height: 2.6rem;
        border-radius: 50%;
        border: 1px solid var(--amber-dim);
        background: rgba(255, 179, 71, 0.08);
        color: var(--amber);
        cursor: pointer;
    }
    .keypad button:hover, .keypad button:focus {
        background: rgba(255, 179, 71, 0.25);
        outline: none;
    }

    /* DVD-style menu (root year menu + scene grid), modeled after
       classic camcorder-authored DVD menus: teal chrome, blue grid,
       thumbnail + metadata rows, Previous/Top/Next footer. */
    .dvd-screen {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        background: linear-gradient(180deg, #4a76ad, #1c3a63);
        color: #eaf6ff;
        text-align: left;
    }
    .dvd-header, .dvd-footer {
        background: linear-gradient(180deg, #b7ede6, #6cc9c2);
        color: #123;
        flex: none;
    }
    .dvd-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.5rem 0.9rem;
        font-size: 0.85rem;
        font-weight: bold;
        border-bottom: 2px solid #2c5a54;
    }
    .dvd-footer {
        display: flex;
        justify-content: space-around;
        padding: 0.5rem;
        border-top: 2px solid #2c5a54;
    }
    .dvd-btn {
        font-family: inherit;
        font-size: 0.72rem;
        background: #3f6fa8;
        color: #eaf6ff;
        border: 1px solid #1c3a5c;
        border-radius: 14px;
        padding: 0.3rem 1rem;
        cursor: pointer;
    }
    .dvd-btn.disabled { opacity: 0.35; cursor: default; }

    .dvd-grid {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-auto-rows: 1fr;
        gap: 0.5rem;
        padding: 0.6rem;
    }
    .dvd-item {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        cursor: pointer;
        min-height: 0;
    }
    .dvd-thumb {
        flex: 0 0 55%;
        aspect-ratio: 4 / 3;
        background: linear-gradient(135deg, #6f8fd0, #3a4f8f);
        border: 2px solid #1c2f57;
        border-radius: 2px;
        overflow: hidden;
        position: relative;
    }
    .dvd-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .dvd-year-label {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.3rem;
        font-weight: bold;
    }
    .dvd-item.selected .dvd-thumb {
        border-color: #d7e85a;
        box-shadow: 0 0 0 2px #d7e85a;
    }
    .dvd-meta {
        font-size: 0.62rem;
        line-height: 1.3;
        text-shadow: 0 1px 1px rgba(0,0,0,0.4);
    }

    .placeholder-box {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        font-size: 0.65rem;
        opacity: 0.6;
        padding: 0.3rem;
        word-break: break-word;
    }

    .viewer-stage {
        width: 100%;
        height: 80%;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .viewer-stage img, .viewer-stage video {
        max-width: 100%;
        max-height: 100%;
    }

    .hint {
        font-size: 0.7rem;
        opacity: 0.55;
    }
</style>
</head>
<body>
    <audio id="crtStart" preload="none">
        <source src="audio/crt-start.mp3" type="audio/mpeg">
        <source src="audio/crt-start.ogg" type="audio/ogg">
    </audio>
    <audio id="crtHum" loop preload="none">
        <source src="audio/crt-hum.mp3" type="audio/mpeg">
        <source src="audio/crt-hum.ogg" type="audio/ogg">
    </audio>
    <div class="tv">
            <div class="screen" id="screen">
                <div class="flicker" id="flicker"></div>

                <section class="view active" data-view="off" id="view-off">
                    <p class="glow-text">click screen, or press ENTER,<br>to turn on</p>
                </section>

                <section class="view" data-view="pin" id="view-pin">
                    <p class="glow-text small">enter code</p>
                    <div class="pin-display" id="pinDisplay">&#9679;&#9679;&#9679;&#9679;</div>
                    <div class="keypad" id="keypad"></div>
                </section>

                <section class="view" data-view="menu" id="view-menu">
                    <div class="dvd-screen">
                        <div class="dvd-header">
                            <span>&#9670; Layal</span>
                            <span id="menuPageIndicator">1/1</span>
                        </div>
                        <div class="dvd-grid" id="discGrid"></div>
                        <div class="dvd-footer">
                            <button class="dvd-btn" id="menuPrev">Previous</button>
                            <button class="dvd-btn disabled" id="menuTop">Top</button>
                            <button class="dvd-btn" id="menuNext">Next</button>
                        </div>
                    </div>
                </section>

                <section class="view" data-view="scene" id="view-scene">
                    <div class="dvd-screen">
                        <div class="dvd-header">
                            <span>&#9670; <span id="sceneTitleText"></span></span>
                            <span id="scenePageIndicator">1/1</span>
                        </div>
                        <div class="dvd-grid" id="thumbGrid"></div>
                        <div class="dvd-footer">
                            <button class="dvd-btn" id="scenePrev">Previous</button>
                            <button class="dvd-btn" id="sceneTop">Top</button>
                            <button class="dvd-btn" id="sceneNext">Next</button>
                        </div>
                    </div>
                </section>

                <section class="view" data-view="viewer" id="view-viewer">
                    <div class="viewer-stage" id="viewerStage"></div>
                    <p class="hint">Esc to go back</p>
                </section>
            </div>
    </div>

<script>
    // ponytail: 4-digit PIN is obscurity only, not real auth. Fine for a family gift link.
    const PIN = "3108";

    const YEARS = {
        2012: { photos: ["1.jpg", "2.jpg", "3.jpg"], videos: ["1.mp4"] },
        2013: { photos: ["1.jpg", "2.jpg", "3.jpg"], videos: ["1.mp4"] },
        2014: { photos: ["1.jpg", "2.jpg", "3.jpg"], videos: ["1.mp4"] },
        2015: { photos: ["1.jpg", "2.jpg", "3.jpg"], videos: ["1.mp4"] },
        2016: { photos: ["1.jpg", "2.jpg", "3.jpg"], videos: ["1.mp4"] },
        2017: { photos: ["1.jpg", "2.jpg", "3.jpg"], videos: ["1.mp4"] },
        2018: { photos: ["1.jpg", "2.jpg", "3.jpg"], videos: ["1.mp4"] },
        2019: { photos: ["1.jpg", "2.jpg", "3.jpg"], videos: ["1.mp4"] },
        2020: { photos: ["1.jpg", "2.jpg", "3.jpg"], videos: ["1.mp4"] },
        2021: { photos: ["1.jpg", "2.jpg", "3.jpg"], videos: ["1.mp4"] },
        2022: { photos: ["1.jpg", "2.jpg", "3.jpg"], videos: ["1.mp4"] },
        2023: { photos: ["1.jpg", "2.jpg", "3.jpg"], videos: ["1.mp4"] },
        2024: { photos: ["1.jpg", "2.jpg", "3.jpg"], videos: ["1.mp4"] },
        2025: { photos: ["1.jpg", "2.jpg", "3.jpg"], videos: ["1.mp4"] },
        2026: { photos: ["1.jpg", "2.jpg", "3.jpg"], videos: ["1.mp4"] },
    };
    const YEAR_LIST = Object.keys(YEARS);

    const PAGE_SIZE = 6; // 2 cols x 3 rows, matches the camcorder DVD-menu look

    const views = document.querySelectorAll(".view");
    const flicker = document.getElementById("flicker");
    const crtHum = document.getElementById("crtHum");
    const crtStart = document.getElementById("crtStart");
    const viewerStage = document.getElementById("viewerStage");
    const pinDisplay = document.getElementById("pinDisplay");
    const keypad = document.getElementById("keypad");

    const AUTOPLAY_STEP_DELAY = 900; // pause on a menu/scene selection before "pressing enter"
    const PHOTO_DWELL = 3500; // ms each photo stays on screen
    const VIDEO_MAX_DWELL = 20000; // safety fallback if a video never fires ended/error

    let state = "off";
    let menuSelected = 0;
    let sceneSelected = 0;
    let currentYear = null;
    let currentItems = [];
    let pinEntered = "";
    let autoPlaying = false;
    let autoTimer = null;

    function setState(next) {
        state = next;
        views.forEach(v => v.classList.toggle("active", v.dataset.view === next));
    }

    function doFlicker(then) {
        flicker.classList.remove("on");
        void flicker.offsetWidth; // restart animation
        flicker.classList.add("on");
        setTimeout(() => { flicker.classList.remove("on"); if (then) then(); }, 500);
    }

    function placeholder(path) {
        const div = document.createElement("div");
        div.className = "placeholder-box";
        div.textContent = "drop file here: " + path;
        return div;
    }

    // --- power on ---
    function powerOn() {
        if (state !== "off") return;
        crtStart.play().catch(() => {}); // plays once, only on power-on
        crtHum.volume = 0.35;
        crtHum.play().catch(() => {}); // ponytail: silent no-op until audio files are dropped in
        doFlicker(() => {
            if (localStorage.getItem("layalUnlocked") === "1") {
                startAutoPlay();
            } else {
                setState("pin");
            }
        });
    }
    document.getElementById("view-off").addEventListener("click", powerOn);

    // --- pin keypad ---
    for (let d = 0; d <= 9; d++) {
        const btn = document.createElement("button");
        btn.textContent = d;
        btn.addEventListener("click", () => enterDigit(String(d)));
        keypad.appendChild(btn);
    }

    function enterDigit(digit) {
        if (pinEntered.length >= 4) return;
        pinEntered += digit;
        renderPin();
        if (pinEntered.length === 4) checkPin();
    }

    function renderPin() {
        pinDisplay.textContent = "●".repeat(pinEntered.length) + "○".repeat(4 - pinEntered.length);
        pinDisplay.classList.remove("error");
    }

    function checkPin() {
        if (pinEntered === PIN) {
            localStorage.setItem("layalUnlocked", "1");
            doFlicker(() => { startAutoPlay(); });
        } else {
            pinDisplay.classList.add("error");
            setTimeout(() => { pinEntered = ""; renderPin(); }, 500);
        }
    }

    // --- DVD-style grid menus (root year menu + scene grid) ---
    function pageInfo(total, selected) {
        const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
        const page = Math.floor(selected / PAGE_SIZE);
        return { totalPages, page };
    }

    function buildGridItem(thumbNode, metaLines, selected, onClick) {
        const item = document.createElement("div");
        item.className = "dvd-item" + (selected ? " selected" : "");
        const thumb = document.createElement("div");
        thumb.className = "dvd-thumb";
        thumb.appendChild(thumbNode);
        const meta = document.createElement("div");
        meta.className = "dvd-meta";
        metaLines.forEach(line => {
            const p = document.createElement("div");
            p.textContent = line;
            meta.appendChild(p);
        });
        item.appendChild(thumb);
        item.appendChild(meta);
        item.addEventListener("click", onClick);
        return item;
    }

    function movePage(which, dir) {
        const total = which === "menu" ? YEAR_LIST.length : currentItems.length;
        const selected = which === "menu" ? menuSelected : sceneSelected;
        const { totalPages, page } = pageInfo(total, selected);
        const newPage = Math.min(totalPages - 1, Math.max(0, page + dir));
        if (newPage === page) return;
        if (which === "menu") { menuSelected = newPage * PAGE_SIZE; renderMenu(); }
        else { sceneSelected = newPage * PAGE_SIZE; renderScene(); }
    }

    function renderMenu() {
        const { totalPages, page } = pageInfo(YEAR_LIST.length, menuSelected);
        document.getElementById("menuPageIndicator").textContent = (page + 1) + "/" + totalPages;
        const grid = document.getElementById("discGrid");
        grid.innerHTML = "";
        const start = page * PAGE_SIZE;
        YEAR_LIST.slice(start, start + PAGE_SIZE).forEach((year, i) => {
            const idx = start + i;
            const label = document.createElement("span");
            label.className = "dvd-year-label";
            label.textContent = year;
            const data = YEARS[year];
            const count = data.photos.length + data.videos.length;
            const gridItem = buildGridItem(label, ["Special Features", count + " items"], idx === menuSelected, () => {
                if (autoPlaying) return;
                menuSelected = idx;
                openYear(year);
            });
            grid.appendChild(gridItem);
        });
        document.getElementById("menuPrev").classList.toggle("disabled", page === 0);
        document.getElementById("menuNext").classList.toggle("disabled", page >= totalPages - 1);
    }
    document.getElementById("menuPrev").addEventListener("click", () => { if (!autoPlaying) movePage("menu", -1); });
    document.getElementById("menuNext").addEventListener("click", () => { if (!autoPlaying) movePage("menu", 1); });

    function openYear(year) {
        currentYear = year;
        const data = YEARS[year];
        currentItems = [
            ...data.photos.map(f => ({ type: "photo", file: f })),
            ...data.videos.map(f => ({ type: "video", file: f })),
        ];
        sceneSelected = 0;
        renderScene();
        setState("scene");
    }

    function renderScene() {
        document.getElementById("sceneTitleText").textContent = currentYear;
        const { totalPages, page } = pageInfo(currentItems.length, sceneSelected);
        document.getElementById("scenePageIndicator").textContent = (page + 1) + "/" + totalPages;
        const grid = document.getElementById("thumbGrid");
        grid.innerHTML = "";
        const start = page * PAGE_SIZE;
        currentItems.slice(start, start + PAGE_SIZE).forEach((item, i) => {
            const idx = start + i;
            const path = "media/" + currentYear + "/" + item.file;
            let thumbNode;
            if (item.type === "photo") {
                const img = document.createElement("img");
                img.src = path;
                img.alt = "";
                img.onerror = () => { img.replaceWith(placeholder(path)); };
                thumbNode = img;
            } else {
                thumbNode = placeholder(path);
            }
            const meta = [item.type === "photo" ? "PHOTO" : "VIDEO", item.file];
            const gridItem = buildGridItem(thumbNode, meta, idx === sceneSelected, () => {
                if (autoPlaying) return;
                sceneSelected = idx;
                openViewer(item);
            });
            grid.appendChild(gridItem);
        });
        document.getElementById("scenePrev").classList.toggle("disabled", page === 0);
        document.getElementById("sceneNext").classList.toggle("disabled", page >= totalPages - 1);
    }
    document.getElementById("scenePrev").addEventListener("click", () => { if (!autoPlaying) movePage("scene", -1); });
    document.getElementById("sceneNext").addEventListener("click", () => { if (!autoPlaying) movePage("scene", 1); });
    document.getElementById("sceneTop").addEventListener("click", () => { if (!autoPlaying) setState("menu"); });

    function openViewer(item) {
        viewerStage.innerHTML = "";
        const path = "media/" + currentYear + "/" + item.file;
        if (item.type === "photo") {
            const img = document.createElement("img");
            img.src = path;
            img.alt = "";
            img.onerror = () => { img.replaceWith(placeholder(path)); };
            viewerStage.appendChild(img);
        } else {
            const video = document.createElement("video");
            video.src = path;
            video.controls = true;
            video.autoplay = true;
            video.onerror = () => { video.replaceWith(placeholder(path)); };
            viewerStage.appendChild(video);
        }
        setState("viewer");
    }

    // --- auto-play: after the correct PIN, tour every year/item on its own ---
    function startAutoPlay() {
        autoPlaying = true;
        autoAdvanceYear(0);
    }

    function autoAdvanceYear(yearIdx) {
        yearIdx = yearIdx % YEAR_LIST.length; // loop forever
        menuSelected = yearIdx;
        renderMenu();
        setState("menu");
        autoTimer = setTimeout(() => {
            openYear(YEAR_LIST[yearIdx]);
            autoAdvanceItem(0, yearIdx);
        }, AUTOPLAY_STEP_DELAY);
    }

    function autoAdvanceItem(itemIdx, yearIdx) {
        if (itemIdx >= currentItems.length) {
            menuSelected = yearIdx;
            renderMenu();
            setState("menu");
            autoTimer = setTimeout(() => autoAdvanceYear(yearIdx + 1), AUTOPLAY_STEP_DELAY);
            return;
        }
        sceneSelected = itemIdx;
        renderScene();
        setState("scene");
        autoTimer = setTimeout(() => {
            const item = currentItems[itemIdx];
            openViewer(item);
            autoAdvanceFromViewer(item, itemIdx, yearIdx);
        }, AUTOPLAY_STEP_DELAY);
    }

    function autoAdvanceFromViewer(item, itemIdx, yearIdx) {
        const goNext = () => autoAdvanceItem(itemIdx + 1, yearIdx);
        if (item.type === "video") {
            const video = viewerStage.querySelector("video");
            let done = false;
            const onceNext = () => { if (done) return; done = true; goNext(); };
            if (video) {
                video.addEventListener("ended", onceNext, { once: true });
                video.addEventListener("error", onceNext, { once: true });
            }
            autoTimer = setTimeout(onceNext, VIDEO_MAX_DWELL);
        } else {
            autoTimer = setTimeout(goNext, PHOTO_DWELL);
        }
    }

    // --- keyboard navigation ---
    document.addEventListener("keydown", (e) => {
        if (autoPlaying) return;
        if (state === "off") {
            if (e.key === "Enter") powerOn();
            return;
        }
        if (state === "pin") {
            if (/^[0-9]$/.test(e.key)) enterDigit(e.key);
            else if (e.key === "Backspace") { pinEntered = pinEntered.slice(0, -1); renderPin(); }
            return;
        }
        if (state === "menu") {
            const total = YEAR_LIST.length;
            if (e.key === "ArrowRight") { menuSelected = (menuSelected + 1) % total; renderMenu(); }
            else if (e.key === "ArrowLeft") { menuSelected = (menuSelected - 1 + total) % total; renderMenu(); }
            else if (e.key === "ArrowDown") { menuSelected = (menuSelected + 2) % total; renderMenu(); }
            else if (e.key === "ArrowUp") { menuSelected = (menuSelected - 2 + total) % total; renderMenu(); }
            else if (e.key === "Enter") openYear(YEAR_LIST[menuSelected]);
            return;
        }
        if (state === "scene") {
            const total = currentItems.length;
            if (e.key === "ArrowRight") { sceneSelected = (sceneSelected + 1) % total; renderScene(); }
            else if (e.key === "ArrowLeft") { sceneSelected = (sceneSelected - 1 + total) % total; renderScene(); }
            else if (e.key === "ArrowDown") { sceneSelected = (sceneSelected + 2) % total; renderScene(); }
            else if (e.key === "ArrowUp") { sceneSelected = (sceneSelected - 2 + total) % total; renderScene(); }
            else if (e.key === "Enter") openViewer(currentItems[sceneSelected]);
            else if (e.key === "Escape") setState("menu");
            return;
        }
        if (state === "viewer") {
            if (e.key === "Escape") setState("scene");
            return;
        }
    });
</script>
</body>
</html>
